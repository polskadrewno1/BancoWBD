<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b50">
<title>INTEREUROPA.PT | Escolha o idioma</title>
<link rel="icon" type="image/svg+xml" href="assets/intereuropa-language-globe.svg">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#0b1f3a,#17447e);font-family:Arial,sans-serif;color:#1e293b}
main{width:min(100%,680px);background:#fff;border-radius:20px;padding:38px 30px;text-align:center;box-shadow:0 18px 55px #06152b66}
.logo{width:66px;height:66px;object-fit:contain}
h1{margin:12px 0 4px;color:#102b50;font-size:25px}
.subtitle{margin:0 0 28px;color:#64748b;letter-spacing:2px;font-size:12px}
.prompt{margin-bottom:18px;color:#334155}
.languages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
button{min-height:54px;border:1px solid #d8e1ed;border-radius:10px;background:#f8fafc;color:#102b50;font-size:16px;font-weight:700;cursor:pointer}
button:hover,button:focus{background:#eaf1fa;border-color:#17447e;outline:2px solid #17447e;outline-offset:2px}
footer{margin-top:26px;color:#94a3b8;font-size:12px}
@media(max-width:480px){main{padding:30px 18px}.languages{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<img class="logo" src="assets/intereuropa-emblem.svg" alt="INTEREUROPA.PT">
<h1>INTEREUROPA.PT</h1>
<p class="subtitle">SOLUÇÕES FINANCEIRAS</p>
<p class="prompt">Selecione o seu idioma / Choose your language</p>
<div class="languages">
<button type="button" data-lang="pt">🇵🇹 Português</button>
<button type="button" data-lang="de">🇩🇪 Deutsch</button>
<button type="button" data-lang="pl">🇵🇱 Polski</button>
<button type="button" data-lang="es">🇪🇸 Español</button>
<button type="button" data-lang="it">🇮🇹 Italiano</button>
<button type="button" data-lang="el">🇬🇷 Ελληνικά</button>
<button type="button" data-lang="sk">🇸🇰 Slovenčina</button>
<button type="button" data-lang="hr">🇭🇷 Hrvatski</button>
<button type="button" data-lang="fr">🇫🇷 Français</button>
<button type="button" data-lang="en">🇬🇧 English</button>
</div>
<footer>© 2026 INTEREUROPA.PT</footer>
</main>
<script>
(function(){
  var supported=["pt","de","pl","es","it","el","sk","hr","fr","en"];
  document.querySelectorAll("[data-lang]").forEach(function(button){
    button.addEventListener("click",function(){
      var lang=button.getAttribute("data-lang");
      if(supported.indexOf(lang)===-1)return;
      try{
        localStorage.setItem("intereuropa_language",lang);
        localStorage.setItem("intereuropa_language_intro_seen","yes");
        sessionStorage.setItem("intereuropa_language_selected_this_visit","yes");
        document.cookie="intereuropa_language="+encodeURIComponent(lang)+"; path=/; max-age=31536000; SameSite=Lax";
      }catch(e){}
      window.location.href="index.html";
    });
  });
})();
</script>
</body>
</html>
