name: Deploy admin-create-financing-request function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/admin-create-financing-request/**"
      - ".github/workflows/deploy-admin-create-financing-request.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: mzrxzuwtndegpwcbkwhj
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy admin-create-financing-request
        run: supabase functions deploy admin-create-financing-request --project-ref "$PROJECT_ID" --yes
