name: Deploy updated admin-list-users function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/admin-list-users/**"
      - ".github/workflows/deploy-admin-list-users-main.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: mzrxzuwtndegpwcbkwhj
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy admin-list-users
        run: supabase functions deploy admin-list-users --project-ref "$PROJECT_ID" --yes
