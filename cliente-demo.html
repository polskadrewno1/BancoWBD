<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BancoWBD | Área de cliente</title>
<link rel="stylesheet" href="style.css">
<style>
.login-box {
  max-width: 480px;
  margin: 60px auto;
  padding: 30px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 30px #10284d18;
}
.login-box h1 { color: #10284d; margin-bottom: 15px; }
.login-box label {
  display: block;
  margin-top: 18px;
  font-weight: bold;
}
.login-box input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccd5e1;
  border-radius: 8px;
  font-size: 16px;
}
.login-box button {
  width: 100%;
  border: 0;
  cursor: pointer;
  margin-top: 22px;
}
#message { margin-top: 18px; }
</style>
</head>

<body>

<header>
  <div class="logo">
    <span>W</span>
    <div>
      <strong>BancoWBD</strong>
      <small>BANCA DIGITAL</small>
    </div>
  </div>
  <nav>
    <a href="index.html">Página inicial</a>
  </nav>
</header>

<main>
  <div class="login-box">
    <p class="tag">ÁREA DE CLIENTE</p>
    <h1>Iniciar sessão</h1>
    <p>Aceda à sua área pessoal.</p>

    <form id="loginForm">
      <label for="email">Endereço de e-mail</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Palavra-passe</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button class="button" id="loginButton" type="submit">
        Entrar
      </button>
    </form>

    <p id="message" role="status"></p>

    <p style="font-size:13px;color:#607089;margin-top:20px">
      Esta área permite testar a autenticação. Não representa
      uma conta bancária nem disponibiliza financiamento real.
    </p>
  </div>
</main>

<footer>
  © 2026 BancoWBD — Projeto em desenvolvimento.
</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://mzrxzuwtndegpwcbkwhj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_WXC0WbSEvvnhcrR6-7VUSw_kABFoXYU";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  button.disabled = true;
  message.textContent = "A autenticar...";

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  button.disabled = false;

  if (error) {
    message.textContent = "Não foi possível iniciar sessão.";
    return;
  }

  message.textContent = "Sessão iniciada com sucesso!";

window.location.href = "cliente-painel.html";
});
</script>
</body>
</html>
