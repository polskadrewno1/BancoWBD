<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoWBD | Candidatura</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <span>W</span>
        <div>
            <strong>BancoWBD</strong>
            <small>SOLUÇÕES FINANCEIRAS</small>
        </div>
    </div>
</header>

<main>
<section class="notice">
    <h1>Pedido de financiamento</h1>
    <p>
        Preencha os campos abaixo para apresentar a sua candidatura.
        O envio do formulário não representa uma aprovação
        nem garante a concessão de financiamento.
    </p>
</section>

<section class="card">
    <form id="formulario">

        <label>Nome completo</label>
        <input type="text" name="nome" required>

        <label>Idade</label>
        <input type="number" name="idade" min="18" required>

        <label>País</label>
        <input type="text" name="pais" required>

        <label>Cidade</label>
        <input type="text" name="cidade" required>

        <label>Profissão</label>
        <input type="text" name="profissao" required>

        <label>Rendimento mensal aproximado</label>
        <input type="number" name="rendimento" min="0" required>

        <label>Montante (€)</label>
        <input type="number" name="montante" min="1" required>

        <label>Prazo de reembolso (em meses)</label>
<input type="number" name="prazo" min="1"
       placeholder="Introduza o número de meses" required>

        <label>Endereço de e-mail</label>
        <input type="email" name="email" required>

        <label>Contacto telefónico / WhatsApp</label>
        <input type="tel" name="telefone" required>

        <label>Finalidade do financiamento</label>
        <textarea name="finalidade" rows="4" required></textarea>

        <label>
    <input type="checkbox" name="consentimento" required>
    Autorizo o contacto para efeitos de análise da candidatura.
</label>

        <button type="submit">Enviar candidatura</button>

<p id="mensagem"></p>
</form>
</section>
</main>

<footer>
    © 2026 BancoWBD. Todos os direitos reservados.
</footer>

<script>
document.getElementById("formulario").addEventListener("submit", function(event) {
    event.preventDefault();
    document.getElementById("mensagem").textContent =
        "Demonstração: o formulário ainda não está ligado à base de dados.";
});
</script>

</body>
</html>
