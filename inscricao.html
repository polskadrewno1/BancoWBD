<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoWBD | Pedido de financiamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <span>W</span>
        <div>
            <strong>BancoWBD</strong>
            <small>SOLUÇÕES FINANCEIRAS</small>
        </div>
    </div>
</header>

<main>
    <section class="notice">
        <h1>Pedido de financiamento</h1>
        <p>
            Preencha cuidadosamente os seus dados.
            O envio deste formulário não representa aprovação
            nem garante a concessão de financiamento.
        </p>
    </section>

    <section class="card">
        <form id="formulario">

            <label>Nome completo</label>
            <input type="text" name="nome_completo" required maxlength="150">

            <label>Idade</label>
            <input type="number" name="idade" min="18" max="120" required>

            <label>País</label>
            <input type="text" name="pais" required maxlength="100">

            <label>Cidade</label>
            <input type="text" name="cidade" required maxlength="100">

            <label>Profissão</label>
            <input type="text" name="profissao" required maxlength="150">

            <label>Rendimento mensal aproximado (€)</label>
            <input type="number" name="rendimento_mensal"
                   min="0" step="0.01" required>

            <label>Montante pretendido (€)</label>
            <input type="number" name="montante"
                   min="1" step="0.01" required>

            <label>Prazo de reembolso (meses)</label>
            <input type="number" name="prazo_reembolso"
                   min="1" max="600" required>

            <label>Endereço de e-mail</label>
            <input type="email" name="email_contacto" required maxlength="200">

            <label>Contacto telefónico / WhatsApp</label>
            <input type="tel" name="telefone" required maxlength="40">

            <label>Finalidade do financiamento</label>
            <textarea name="finalidade" rows="5"
                placeholder="Explique para que pretende utilizar o financiamento..."
                required maxlength="3000"></textarea>

            <label class="consentimento">
                <input type="checkbox" name="consentimento" required>
                Autorizo o tratamento dos meus dados para análise
                do meu pedido de financiamento.
            </label>

            <button type="submit">Enviar candidatura</button>

            <p id="mensagem" role="status"></p>
        </form>
    </section>
</main>

<footer>
    © 2026 BancoWBD. Todos os direitos reservados.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mzrxzuwtndegpwcbkwhj.supabase.co";
const SUPABASE_KEY = "sb_publishable_WXC0WbSEvvnhcrR6-7VUSw_kABFoXYU";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const formulario = document.getElementById("formulario");
const mensagem = document.getElementById("mensagem");
const botao = formulario.querySelector("button");

async function verificarSessao() {
    const { data, error } =
        await supabaseClient.auth.getSession();

    if (error || !data.session) {
        mensagem.textContent =
            "Para apresentar uma candidatura, deve primeiro criar uma conta ou iniciar sessão.";

        window.location.replace(
            "cliente-demo.html?redirect=inscricao.html"
        );
    }
}

formulario.addEventListener("submit", async function(event) {
    event.preventDefault();
    mensagem.textContent = "";

    const { data, error: erroSessao } =
        await supabaseClient.auth.getSession();

    if (erroSessao || !data.session) {
        mensagem.textContent =
            "A sua sessão terminou. Inicie sessão novamente.";
        return;
    }

    const f = formulario;

    const idade = Number(f.idade.value);
    const rendimento = Number(f.rendimento_mensal.value);
    const montante = Number(f.montante.value);
    const prazo = Number(f.prazo_reembolso.value);
    const finalidade = f.finalidade.value.trim();

    if (
        idade < 18 ||
        rendimento < 0 ||
        montante <= 0 ||
        prazo < 1 ||
        !finalidade
    ) {
        mensagem.textContent =
            "Verifique os valores introduzidos nos campos.";
        return;
    }

    botao.disabled = true;
    botao.textContent = "A enviar...";

    const pedido = {
        user_id: data.session.user.id,
        nome_completo: f.nome_completo.value.trim(),
        idade: idade,
        pais: f.pais.value.trim(),
        cidade: f.cidade.value.trim(),
        profissao: f.profissao.value.trim(),
        rendimento_mensal: rendimento,
        montant_demande: montante,
        prazo_reembolso: prazo,
        email_contacto: f.email_contacto.value.trim(),
        telefone: f.telefone.value.trim(),
        objet_demande: finalidade,
        statut: "reçue"
    };

    const { error } = await supabaseClient
        .from("demandes_financement")
        .insert([pedido]);

    botao.disabled = false;
    botao.textContent = "Enviar candidatura";

    if (error) {
        mensagem.textContent =
            "Não foi possível enviar o pedido: " + error.message;
        return;
    }

    mensagem.textContent =
        "O seu pedido foi recebido com sucesso. Aguarde o contacto da nossa equipa.";

    formulario.reset();
});

verificarSessao();
</script>

</body>
</html>
